<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="topTL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0CFFF"/>
      <stop offset="100%" stop-color="#8AB8FF"/>
    </linearGradient>
    <linearGradient id="topTR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AB8FF"/>
      <stop offset="100%" stop-color="#5498FF"/>
    </linearGradient>
    <linearGradient id="topBL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5498FF"/>
      <stop offset="100%" stop-color="#3384FF"/>
    </linearGradient>
    <linearGradient id="topBR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3384FF"/>
      <stop offset="100%" stop-color="#0065FF"/>
    </linearGradient>
    <linearGradient id="leftTL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0065FF"/>
      <stop offset="100%" stop-color="#005CE8"/>
    </linearGradient>
    <linearGradient id="leftBL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005CE8"/>
      <stop offset="100%" stop-color="#0048B5"/>
    </linearGradient>
    <linearGradient id="leftTR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0048B5"/>
      <stop offset="100%" stop-color="#3384FF"/>
    </linearGradient>
    <linearGradient id="leftBR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005CE8"/>
      <stop offset="100%" stop-color="#0048B5"/>
    </linearGradient>
    <linearGradient id="rightTL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005CE8"/>
      <stop offset="100%" stop-color="#0048B5"/>
    </linearGradient>
    <linearGradient id="rightBL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0048B5"/>
      <stop offset="100%" stop-color="#00388C"/>
    </linearGradient>
    <linearGradient id="rightTR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00388C"/>
      <stop offset="100%" stop-color="#002A6B"/>
    </linearGradient>
    <linearGradient id="rightBR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0048B5"/>
      <stop offset="100%" stop-color="#00388C"/>
    </linearGradient>
    <linearGradient id="arrowSh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0065FF"/>
      <stop offset="100%" stop-color="#005CE8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- == TOP FACES == -->
  <polygon points="256,168 298,189 256,210 214,189" fill="url(#topTL)" stroke="#B0CFFF" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="298,189 340,210 298,231 256,210" fill="url(#topTR)" stroke="#8AB8FF" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="214,189 256,210 214,231 172,210" fill="url(#topBL)" stroke="#5498FF" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="256,210 298,231 256,252 214,231" fill="url(#topBR)" stroke="#3384FF" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- == LEFT FACES == -->
  <polygon points="214,189 256,210 256,280 214,259" fill="url(#leftTL)" stroke="#0065FF" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="172,210 214,231 214,301 172,280" fill="url(#leftTR)" stroke="#0048B5" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="256,210 298,231 298,301 256,280" fill="url(#leftBL)" stroke="#005CE8" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="214,231 256,252 256,322 214,301" fill="url(#leftBR)" stroke="#005CE8" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- == RIGHT FACES == -->
  <polygon points="256,210 298,189 298,259 256,280" fill="url(#rightTL)" stroke="#005CE8" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="298,231 340,210 340,280 298,301" fill="url(#rightTR)" stroke="#00388C" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="298,189 340,210 340,280 298,259" fill="url(#rightBL)" stroke="#0048B5" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="256,252 298,231 298,301 256,322" fill="url(#rightBR)" stroke="#0048B5" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- == SHARE ARROW == -->
  <rect x="247" y="130" width="18" height="68" rx="9" fill="url(#arrowSh)"/>
  <polygon points="256,96 233,136 279,136" fill="#0065FF" filter="url(#glow)"/>
</svg>
