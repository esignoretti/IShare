<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0065FF"/>
      <stop offset="100%" stop-color="#3384FF"/>
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="22 66" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Top faces (2x2 cube cluster at center) -->
  <polygon points="16,11.5 17.5,12 16,12.5 14.5,12" fill="#8AB8FF"/>
  <polygon points="17.5,12 19,12.5 17.5,13 16,12.5" fill="#5498FF"/>
  <polygon points="14.5,12 16,12.5 14.5,13 13,12.5" fill="#3384FF"/>
  <polygon points="16,12.5 17.5,13 16,13.5 14.5,13" fill="#0065FF"/>

  <!-- Left faces -->
  <polygon points="14.5,12 16,12.5 16,14 14.5,13.5" fill="#0065FF"/>
  <polygon points="13,12.5 14.5,13 14.5,14.5 13,14" fill="#005CE8"/>
  <polygon points="16,12.5 17.5,13 17.5,14.5 16,14" fill="#0048B5"/>
  <polygon points="14.5,13 16,13.5 16,15 14.5,14.5" fill="#0048B5"/>

  <!-- Right faces -->
  <polygon points="16,12.5 17.5,12 17.5,13.5 16,14" fill="#005CE8"/>
  <polygon points="17.5,13 19,12.5 19,14 17.5,14.5" fill="#0048B5"/>
  <polygon points="17.5,12 19,12.5 19,14 17.5,13.5" fill="#00388C"/>
  <polygon points="16,13.5 17.5,13 17.5,14.5 16,15" fill="#002A6B"/>

  <!-- Arrow -->
  <rect x="15" y="6" width="2" height="7" rx="1" fill="#FFF"/>
  <polygon points="16,5 14,8 18,8" fill="#FFF"/>
</svg>
