<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 2x2x2 cube cluster + share arrow (monochrome template) -->

  <!-- Top faces -->
  <polygon points="12,5.5 14.5,7 12,8.5 9.5,7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="14.5,7 17,8.5 14.5,10 12,8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="9.5,7 12,8.5 9.5,10 7,8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="12,8.5 14.5,10 12,11.5 9.5,10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Left faces -->
  <polygon points="9.5,7 12,8.5 12,12.5 9.5,11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="7,8.5 9.5,10 9.5,14 7,12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="12,8.5 14.5,10 14.5,14 12,12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="9.5,10 12,11.5 12,15.5 9.5,14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Right faces -->
  <polygon points="12,8.5 14.5,7 14.5,11 12,12.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="14.5,7 17,8.5 17,12.5 14.5,11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="14.5,10 17,8.5 17,12.5 14.5,14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="12,11.5 14.5,10 14.5,14 12,15.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Arrow -->
  <rect x="11.3" y="1.5" width="1.4" height="4.5" rx="0.7" fill="currentColor"/>
  <polygon points="12,0 10.5,2.8 13.5,2.8" fill="currentColor"/>
</svg>
